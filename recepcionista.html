<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepcionista: Control Calle 30</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #0056b3; border-bottom: 4px solid #ffc107; }
        
        .resumen-recep { font-weight: bold; border-radius: 8px; padding: 10px; color: white; text-align: center; }
        .bg-espera { background-color: #0d6efd; }
        .bg-ruta { background-color: #fd7e14; }
        .bg-exito { background-color: #198754; }

        .card-guia { border-radius: 12px; transition: 0.3s; margin-bottom: 8px; border-left: 8px solid #0d6efd; background: white; position: relative; }
        .card-buscando { border-left-color: #fd7e14 !important; }
        .alerta-critica { background-color: #ffdddd !important; border-color: #dc3545 !important; }

        /* Mejora Chatbot */
        .badge-chatbot { background-color: #0056b3; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 800; vertical-align: middle; margin-left: 5px; border: 1px solid #ffc107; }
        .animar-entrada { animation: flash-blue 1.5s infinite; }
        @keyframes flash-blue { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .tiempo-badge { font-family: 'Courier New', monospace; font-weight: 900; font-size: 1.1rem; color: #dc3545; }
        
        .detalle-inventario-recep {
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
            padding: 4px 10px;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #555;
        }
        .ubicacion-highlight { color: #0056b3; font-weight: 800; }
        .separador { margin: 0 6px; color: #ccc; }

        .historial-tabla { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<audio id="audioNotificacion" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<nav class="navbar navbar-dark mb-4 shadow">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1">🚀 PUNTO CALLE 30 - RECEPCIONISTA</span>
        <div>
            <button class="btn btn-sm btn-light fw-bold me-2" onclick="activarPermisos()">🔔 ACTIVAR ALERTAS</button>
            <button class="btn btn-sm btn-danger fw-bold" onclick="cierreDeTurnoOperativo()">
                <i class="bi bi-lock-fill"></i> CIERRE DE TURNO
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card p-3 shadow-sm border-0">
                <label class="form-label fw-bold">1. ESCANEAR NUEVA GUÍA</label>
                <div class="input-group">
                    <input type="text" id="guiaInput" class="form-control form-control-lg border-primary" placeholder="Número de guía..." autofocus>
                    <button class="btn btn-primary" id="btnAsignar">ASIGNAR</button>
                </div>
                <div id="statusMsg" class="mt-2 text-center" style="min-height: 30px;"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="resumen-recep bg-espera shadow-sm">
                <div class="small">EN FILA</div>
                <div class="h2 mb-0" id="dashPendientes">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="resumen-recep bg-ruta shadow-sm">
                <div class="small">BUSCANDO</div>
                <div class="h2 mb-0" id="dashBuscando">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="resumen-recep bg-exito shadow-sm">
                <div class="small">LISTAS</div>
                <div class="h2 mb-0" id="dashListas">0</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-7">
            <h5 class="mb-3 text-secondary"><i class="bi bi-clock-history"></i> Flujo en Tiempo Real</h5>
            <div id="listaTareas">
                <p class="text-muted">Cargando...</p>
            </div>
        </div>

        <div class="col-md-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-secondary"><i class="bi bi-check-all"></i> Gestión de Hoy</h5>
                <button class="btn btn-outline-success btn-sm fw-bold" onclick="exportarExcel()">📊 EXCEL</button>
            </div>
            <div class="historial-tabla">
                <table class="table table-hover mb-0" id="tablaExcel">
                    <thead class="table-dark text-white">
                        <tr><th>Guía</th><th>Tiempo</th><th>Estado</th></tr>
                    </thead>
                    <tbody id="tablaHistorial"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, where, doc, updateDoc, writeBatch, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    /* --- BLOQUE 0: IDENTIDAD --- */
    const firebaseConfig = {
        apiKey: "AIzaSyBzM3A6yc1nj858w9MWhIAz3b4T5QqtauQ",
        authDomain: "picking-inter.firebaseapp.com",
        projectId: "picking-inter",
        storageBucket: "picking-inter.firebasestorage.app",
        messagingSenderId: "444247400767",
        appId: "1:444247400767:web:04c7e6beed0b55d158b38a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const guiasRef = collection(db, "guias");

    const inputGuia = document.getElementById('guiaInput');
    const btnAsignar = document.getElementById('btnAsignar');
    const statusMsg = document.getElementById('statusMsg');

    let guiasActivas = new Set();
    let todasLasGuias = [];
    const cacheInventario = {};
    let guiasNotificadas = new Set();
    let modoTitileo = null;
    let primeraCarga = true;

    /* --- BLOQUE 1: ALERTAS --- */
    window.activarPermisos = () => {
        Notification.requestPermission().then(p => { if(p==='granted') alert("Notificaciones activas"); });
    };

    function ejecutarAlerta(guiaNum) {
        document.getElementById('audioNotificacion').play().catch(e => console.log("Interacción requerida"));
        if (Notification.permission === "granted") {
            new Notification("🤖 NUEVA GUÍA CHATBOT", { body: `Guía #${guiaNum} en cola.` });
        }
        if (!modoTitileo) {
            let alternar = false;
            modoTitileo = setInterval(() => {
                document.title = alternar ? "⚠️ NUEVA GUÍA" : "Recepcionista: Control Calle 30";
                alternar = !alternar;
            }, 800);
        }
    }

    window.onfocus = () => { if (modoTitileo) { clearInterval(modoTitileo); modoTitileo = null; document.title = "Recepcionista: Control Calle 30"; } };

    /* --- BLOQUE 2: GESTIÓN DE GUÍAS --- */
    async function guardarGuia() {
        const numero = inputGuia.value.trim();
        if (!numero) return;
        try {
            await addDoc(guiasRef, { 
                numero_guia: String(numero), 
                estado: "pendiente", 
                creadoEn: serverTimestamp(), 
                archivado: false, 
                zona: "ZONA JESUS",
                origen: "manual"
            });
            statusMsg.innerHTML = `<div class="text-success fw-bold">✅ #${numero} Asignada</div>`;
            inputGuia.value = ""; inputGuia.focus();
        } catch (e) { statusMsg.innerHTML = `❌ Error`; }
    }

    /* --- BLOQUE 3: LECTURA EN TIEMPO REAL (CIRUGÍA: QUITAMOS FILTRO RÍGIDO) --- */
    onSnapshot(query(guiasRef, where("archivado", "==", false)), (snapshot) => {
        todasLasGuias = [];
        snapshot.forEach(d => {
            const data = {id: d.id, ...d.data()};
            // Solo mostramos las que pertenecen a esta zona
            if (data.zona === "ZONA JESUS") {
                todasLasGuias.push(data);
                if (data.estado !== 'encontrada' && !cacheInventario[data.numero_guia]) fetchInventario(data.numero_guia);
                
                // Alerta para Chatbot (QR)
                const esChatbot = data.origen && data.origen.toLowerCase().includes("qr");
                if (!primeraCarga && esChatbot && data.estado === "pendiente" && !guiasNotificadas.has(data.id)) {
                    ejecutarAlerta(data.numero_guia);
                    guiasNotificadas.add(data.id);
                } else if (primeraCarga && esChatbot) {
                    guiasNotificadas.add(data.id);
                }
            }
        });
        primeraCarga = false;
        renderizar();
    });

    /* --- BLOQUE 4: BÚSQUEDA EN INVENTARIO (CIRUGÍA: MATCH CON ID DE CARGA) --- */
    async function fetchInventario(numGuia) {
        if (!numGuia || cacheInventario[numGuia]) return;
        try {
            const docRef = doc(db, "inventario_9450", String(numGuia).trim());
            const invDoc = await getDoc(docRef);
            if (invDoc.exists()) {
                const d = invDoc.data();
                cacheInventario[numGuia] = `📍 <span class="ubicacion-highlight">${d.ubicacion}</span> <span class="separador">|</span> ⚖️ ${d.peso} <span class="separador">|</span> 📦 ${d.contenido}`;
            } else {
                cacheInventario[numGuia] = `⚠️ No registrado en Excel 9450`;
            }
            renderizar();
        } catch (e) { cacheInventario[numGuia] = "Error carga"; }
    }

    /* --- BLOQUE 5: VISTAS (TODO IGUAL) --- */
    function renderizar() {
        const lista = document.getElementById('listaTareas');
        const tabla = document.getElementById('tablaHistorial');
        let p = 0, b = 0, e = 0;
        lista.innerHTML = ""; tabla.innerHTML = ""; guiasActivas.clear();

        todasLasGuias.sort((x, y) => (x.creadoEn?.seconds || 0) - (y.creadoEn?.seconds || 0));

        todasLasGuias.forEach(g => {
            guiasActivas.add(String(g.numero_guia));
            const ahora = new Date();
            const inicio = g.creadoEn ? new Date(g.creadoEn.seconds * 1000) : ahora;
            const esChatbot = g.origen && g.origen.toLowerCase().includes("qr");
            
            if (g.estado !== "encontrada") {
                if (g.estado === "pendiente") p++; else b++;
                const diffMs = ahora - inicio;
                const m = Math.floor(diffMs / 60000);
                const s = Math.floor((diffMs % 60000) / 1000);
                
                lista.innerHTML += `
                    <div class="card card-guia shadow-sm ${m >= 20 ? 'alerta-critica' : ''} ${g.estado === 'buscando' ? 'card-buscando' : ''} ${esChatbot && g.estado==='pendiente' ? 'animar-entrada' : ''}">
                        <div class="card-body p-0">
                            <div class="d-flex justify-content-between align-items-center px-3 py-2">
                                <div>
                                    <h5 class="mb-0 d-inline-block me-1">#${g.numero_guia}</h5>
                                    ${esChatbot ? '<span class="badge-chatbot">Chatbot</span>' : ''}
                                    <span class="badge ${g.estado === 'buscando' ? 'bg-warning text-dark' : 'bg-primary'}" style="font-size:0.7rem;">${g.estado.toUpperCase()}</span>
                                </div>
                                <div class="tiempo-badge">${m}:${s.toString().padStart(2, '0')}</div>
                            </div>
                            <div class="detalle-inventario-recep">${cacheInventario[g.numero_guia] || '🔍 Buscando...'}</div>
                        </div>
                    </div>`;
            } else {
                e++;
                const fin = g.finBusqueda ? new Date(g.finBusqueda.seconds * 1000) : inicio;
                const totalSeg = Math.floor((fin - inicio) / 1000);
                tabla.innerHTML += `<tr><td class="fw-bold">#${g.numero_guia}</td><td>${Math.floor(totalSeg/60)}m ${totalSeg%60}s</td><td><span class="badge bg-success">LISTO</span></td></tr>`;
            }
        });
        document.getElementById('dashPendientes').innerText = p;
        document.getElementById('dashBuscando').innerText = b;
        document.getElementById('dashListas').innerText = e;
    }

    /* --- BLOQUE 6: UTILIDADES --- */
    window.cierreDeTurnoOperativo = async () => {
        const pass = prompt("🔐 Contraseña:");
        if (pass === "INTER30") {
            const batch = writeBatch(db);
            const q = query(guiasRef, where("archivado", "==", false), where("zona", "==", "ZONA JESUS"));
            const snap = await getDocs(q);
            snap.forEach(d => batch.update(doc(db, "guias", d.id), { archivado: true }));
            await batch.commit();
            alert("✅ Turno cerrado.");
        }
    };

    window.exportarExcel = () => {
        const table = document.getElementById("tablaExcel");
        let csv = "Guia,Tiempo,Estado\n";
        table.querySelectorAll("tr").forEach(row => {
            const cols = row.querySelectorAll("td");
            if (cols.length > 0) csv += Array.from(cols).map(c => c.innerText).join(",") + "\n";
        });
        const blob = new Blob([csv], { type: "text/csv" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Reporte_CLL30.csv`;
        link.click();
    };

    setInterval(renderizar, 1000);
    btnAsignar.onclick = guardarGuia;
    inputGuia.onkeypress = (e) => { if(e.key === 'Enter') guardarGuia(); };
</script>
</body>
</html>
