<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Turno - Calle 30</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0056b3; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; }
        .card-consulta { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        
        /* Estilos de la Barra de Estado (Stepper) VIVIENTE */
        .stepper { display: flex; justify-content: space-between; position: relative; margin-bottom: 30px; margin-top: 20px; }
        .stepper::before { content: ""; position: absolute; top: 25px; left: 10%; right: 10%; height: 4px; background: #e0e0e0; z-index: 1; }
        .step-item { position: relative; z-index: 2; text-align: center; width: 33%; }
        .step-icon { width: 50px; height: 50px; border-radius: 50%; background: #e0e0e0; color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 1.2rem; transition: 0.4s; border: 4px solid white; }
        .step-text { font-size: 0.75rem; font-weight: bold; color: #999; text-transform: uppercase; }
        
        /* Colores de estados activos */
        .active .step-icon { background: #ffc107; color: #212529; transform: scale(1.1); box-shadow: 0 0 15px rgba(255,193,7,0.5); }
        .active .step-text { color: #ffc107; }
        .completed .step-icon { background: #198754; color: white; }
        .completed .step-text { color: #198754; }
        
        /* Animación de latido (La esencia viva) */
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 
            0% { box-shadow: 0 0 0 0px rgba(255, 193, 7, 0.7); } 
            100% { box-shadow: 0 0 0 15px rgba(255, 193, 7, 0); } 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-consulta text-center">
                <h3 class="fw-bold mb-1 text-primary">INTERRAPIDÍSIMO</h3>
                <h5 class="mb-4 text-secondary small">CONSULTA DE TURNO - CALLE 30</h5>
                
                <div class="input-group mb-1 shadow-sm">
                    <input type="text" id="busquedaCliente" class="form-control form-control-lg border-0 bg-light" placeholder="Escribe tu número de guía...">
                    <button class="btn btn-warning fw-bold" onclick="consultarGuia()">BUSCAR</button>
                </div>
                
                <div class="text-center mb-4">
                    <small class="text-muted"><i class="bi bi-clock-history"></i> Actualización instantánea</small>
                </div>
                
                <div id="resultadoCliente" style="display:none;">
                    <hr>
                    <p class="mb-4">Guía: <strong id="numGuiaDisplay" class="text-primary h5"></strong></p>
                    
                    <div class="stepper">
                        <div class="step-item" id="step1">
                            <div class="step-icon"><i class="bi bi-box-seam"></i></div>
                            <div class="step-text">Recibido</div>
                        </div>
                        <div class="step-item" id="step2">
                            <div class="step-icon"><i class="bi bi-search"></i></div>
                            <div class="step-text">Buscando</div>
                        </div>
                        <div class="step-item" id="step3">
                            <div class="step-icon"><i class="bi bi-person-check"></i></div>
                            <div class="step-text">¡Listo!</div>
                        </div>
                    </div>

                    <div id="statusMessage" class="alert fw-bold py-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBzM3A6yc1nj858w9MWhIAz3b4T5QqtauQ",
        authDomain: "picking-inter.firebaseapp.com",
        projectId: "picking-inter",
        storageBucket: "picking-inter.firebasestorage.app",
        messagingSenderId: "444247400767",
        appId: "1:444247400767:web:04c7e6beed0b55d158b38a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let unsubscribe = null;

    window.consultarGuia = () => {
        const num = document.getElementById('busquedaCliente').value.trim();
        if(!num) return;
        
        if(unsubscribe) unsubscribe();

        // Filtramos para que solo vea guías que no estén archivadas
        const q = query(collection(db, "guias"), where("numero_guia", "==", num), where("archivado", "==", false));
        
        unsubscribe = onSnapshot(q, (snapshot) => {
            const resDiv = document.getElementById('resultadoCliente');
            const statusMsg = document.getElementById('statusMessage');
            const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];

            if (snapshot.empty) {
                resDiv.style.display = "block";
                statusMsg.className = "alert alert-secondary";
                statusMsg.innerText = "Guía no encontrada. Verifica el número.";
                steps.forEach(s => s.className = "step-item");
                return;
            }

            snapshot.forEach((doc) => {
                const guia = doc.data();
                resDiv.style.display = "block";
                document.getElementById('numGuiaDisplay').innerText = "#" + guia.numero_guia;
                
                steps.forEach(s => s.className = "step-item");

                if (guia.estado === "pendiente") {
                    steps[0].classList.add('active', 'pulse');
                    statusMsg.className = "alert alert-info text-dark";
                    statusMsg.innerText = "Estamos procesando tu solicitud.";
                } else if (guia.estado === "buscando") {
                    steps[0].classList.add('completed');
                    steps[1].classList.add('active', 'pulse');
                    statusMsg.className = "alert alert-warning text-dark";
                    statusMsg.innerText = "Tu paquete está siendo localizado.";
                } else if (guia.estado === "encontrada") {
                    steps[0].classList.add('completed');
                    steps[1].classList.add('completed');
                    steps[2].classList.add('active', 'completed');
                    statusMsg.className = "alert alert-success";
                    statusMsg.innerHTML = "✅ ¡LISTO, ENCONTRADO!<br>Acércate al mostrador.";
                }
            });
        });
    };
</script>
</body>
</html>
